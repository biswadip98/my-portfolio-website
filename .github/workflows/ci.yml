name: CI Pipeline
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Allow the workflow to push the tag-update commit back to the repo.
permissions:
  contents: write

jobs:
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dockerfile-lint:
    name: Dockerfile Lint (Hadolint)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4
      - name: Lint backend Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: backend/Dockerfile
          failure-threshold: warning
      - name: Lint frontend Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: frontend/Dockerfile
          failure-threshold: warning

  build-and-scan:
    name: Build, Scan and Push Images
    runs-on: ubuntu-latest
    needs: [secret-scan, dockerfile-lint]
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: biswadipdevops/portfolio-backend:${{ github.sha }}

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: true
          tags: biswadipdevops/portfolio-frontend:${{ github.sha }}

      - name: Install Trivy
        run: |
          sudo apt-get install -y wget apt-transport-https gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Scan backend image with Trivy
        run: |
          trivy image --severity CRITICAL --ignore-unfixed --exit-code 1 --format table biswadipdevops/portfolio-backend:${{ github.sha }}

      - name: Scan frontend image with Trivy
        run: |
          trivy image --severity CRITICAL --ignore-unfixed --exit-code 1 --format table biswadipdevops/portfolio-frontend:${{ github.sha }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push backend image
        run: docker push biswadipdevops/portfolio-backend:${{ github.sha }}

      - name: Push frontend image
        run: docker push biswadipdevops/portfolio-frontend:${{ github.sha }}

      - name: Update image tags in values.yaml
        run: |
          sed -i '32s|tag: .*|tag: "${{ github.sha }}"|' helm/portfolio/values.yaml
          sed -i '50s|tag: .*|tag: "${{ github.sha }}"|' helm/portfolio/values.yaml
          echo "Updated tags:"
          grep -n "tag:" helm/portfolio/values.yaml

      - name: Commit and push updated tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/portfolio/values.yaml
          git commit -m "Update image tags to ${{ github.sha }} [skip ci]"
          git push
