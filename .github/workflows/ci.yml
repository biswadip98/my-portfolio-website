name: CI Pipeline
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Allow the workflow to push the tag-update commit back to the repo.
permissions:
  contents: write

jobs:
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dockerfile-lint:
    name: Dockerfile Lint (Hadolint)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Lint backend Dockerfile
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: backend/Dockerfile
          failure-threshold: warning
      - name: Lint frontend Dockerfile
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: frontend/Dockerfile
          failure-threshold: warning

  sast:
    name: SAST (SonarQube Cloud)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.qualitygate.wait=true

  build-and-scan:
    name: Build, Scan and Push Images
    runs-on: ubuntu-latest
    needs: [secret-scan, dockerfile-lint, sast]
    steps:
      - name: Check out the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build backend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./backend
          push: false
          load: true
          tags: biswadipdevops/portfolio-backend:${{ github.sha }}

      - name: Build frontend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./frontend
          push: false
          load: true
          tags: biswadipdevops/portfolio-frontend:${{ github.sha }}

      - name: Install Trivy
        run: |
          sudo apt-get install -y wget apt-transport-https gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Scan backend image with Trivy
        run: |
          trivy image --severity CRITICAL --ignore-unfixed --exit-code 1 --format table biswadipdevops/portfolio-backend:${{ github.sha }}

      - name: Scan frontend image with Trivy
        run: |
          trivy image --severity CRITICAL --ignore-unfixed --exit-code 1 --format table biswadipdevops/portfolio-frontend:${{ github.sha }}

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push backend image
        run: docker push biswadipdevops/portfolio-backend:${{ github.sha }}

      - name: Push frontend image
        run: docker push biswadipdevops/portfolio-frontend:${{ github.sha }}

      - name: Update image tags in values.yaml
        run: |
          sed -i '32s|tag: .*|tag: "${{ github.sha }}"|' helm/portfolio/values.yaml
          sed -i '50s|tag: .*|tag: "${{ github.sha }}"|' helm/portfolio/values.yaml
          echo "Updated tags:"
          grep -n "tag:" helm/portfolio/values.yaml

      - name: Commit and push updated tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/portfolio/values.yaml
          git commit -m "Update image tags to ${{ github.sha }} [skip ci]"
          git push